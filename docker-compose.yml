version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trendradar
      POSTGRES_PASSWORD: trendradar
      POSTGRES_DB: trendradar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendradar -d trendradar"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://trendradar:trendradar@postgres:5432/trendradar
      REDIS_URL: redis://redis:6379/0
      BASIC_AUTH_USER: admin
      BASIC_AUTH_PASSWORD: admin
      APP_ENV: dev
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://trendradar:trendradar@postgres:5432/trendradar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app beat --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://trendradar:trendradar@postgres:5432/trendradar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
